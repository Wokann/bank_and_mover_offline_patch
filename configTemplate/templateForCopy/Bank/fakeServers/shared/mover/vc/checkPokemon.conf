[global]
enableCheckPokemon=true;

[rule.BanUnicodeChinese]
enabled=1;
action=reject;
condition=
    UnicodeChinese == true;

[rule.025_240_dizzy_punch]
enabled=1;
action=reject;
condition=
    (species == 25 || species == 26 ||
     species == 35 || species == 36 ||
     species == 39 || species == 40 ||
     species == 106 || species == 107 ||
     species == 124 || species == 125 || species == 126 ||
     species == 172 || species == 173 || species == 174 ||
     species == 236 || species == 237 || species == 238 ||
     species == 239 || species == 240) &&
    move == 146;

[rule.115_duplicate_moves]
enabled=0;
action=reject;
condition=species == 115 && duplicate_moves == true;

[rule.144_146_min_level50]
enabled=0;
action=require;
condition=
    (species == 144 || species == 145 || species == 146) &&
    level >= 50;

[rule.150_mewtwo_min_level70]
enabled=1;
action=require;
condition=species == 150 && level >= 70;

[rule.151_mew_ot_tid22796]
enabled=1;
action=require;
condition=
    species == 151 &&
    tid == 22796 &&
    (ot == "GF" || ot == "ゲーフリ");

[rule.251_celebi_min_level30]
enabled=1;
action=require;
condition=species == 251 && level >= 30;

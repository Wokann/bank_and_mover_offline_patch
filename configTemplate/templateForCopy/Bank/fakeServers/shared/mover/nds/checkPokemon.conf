[global]
enableCheckPokemon=true;

[rule.BanUnicodeChinese]
enabled=1;
action=reject;
condition=
    UnicodeChinese == true;

[rule.251_648_shiny_locked]
enabled=1;
action=reject;
condition=
    (species == 251 || species == 493 || species == 494 ||
     species == 647 || species == 648) && shiny == true;

[rule.491_darkrai_pearl_fateful0]
enabled=1;
action=reject;
condition=species == 491 && origin == 11 && fateful == false;

[rule.492_shaymin_dp_fateful0]
enabled=1;
action=reject;
condition=
    species == 492 &&
    (origin == 10 || origin == 11) &&
    fateful == false;
